<!doctype html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>安間の好きなものまとめサイト</title>
<link rel='icon' href='favicon.svg' type='image/svg+xml'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap'>
<style>
:root{--bg:#eef4f0;--surface:#ffffff;--sunk:#e1ece5;--ink:#0d261c;--muted:#4f6d5e;--line:#cfe0d6;--band:#0a3326;--band-2:#0f4a36;--band-ink:#ecfff5;--band-muted:#9ccfb6;--accent:#0c7a4f;--accent-ink:#ffffff;--glow:#3fd197;--f-body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;--f-data:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#08130e;--surface:#0f2119;--sunk:#152d22;--ink:#e3f0e9;--muted:#8fb3a2;--line:#20392d;--band:#0b2a1f;--band-2:#103a2b;--band-muted:#86c4a6;--accent:#3fd197;--accent-ink:#06150f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
a:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.hero{color:var(--band-ink);background:linear-gradient(120deg,var(--band) 0%,var(--band) 55%,var(--band-2) 100%);padding:calc(56px + env(safe-area-inset-top,0px)) 16px 48px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 22px)}
.hero-in{max-width:1080px;margin:0 auto;position:relative;z-index:1;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--band-muted);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:28px;height:2px;background:var(--glow)}
h1{margin:0;font-weight:900;font-size:clamp(28px,5.2vw,52px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
h1 .em{color:var(--glow)}
.lead{margin:0;color:var(--band-muted);max-width:52ch}
main{max-width:1080px;margin:0 auto;padding:36px 16px 64px;display:flex;flex-direction:column;gap:20px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:18px;letter-spacing:.04em}
.count{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.board{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s,box-shadow .2s}
.board:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 28px -16px var(--accent)}
.top{display:flex;align-items:center;gap:12px}
.mark{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--accent)}
.mark svg{width:24px;height:24px}
.tag{font-family:var(--f-data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.board h3{margin:0;font-size:19px;line-height:1.35}
.board p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:11px 16px;font-size:14px}
.go .arr{transition:transform .2s}
.board:hover .go .arr{transform:translateX(4px)}
.soon{display:flex;flex-direction:column;justify-content:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted);min-height:180px}
.soon strong{color:var(--ink);font-size:15px}
.soon span{font-size:13px}
footer{max-width:1080px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class='hero'>
  <div class='hero-in'>
    <div class='eyebrow'>Anma's Favorites</div>
    <h1>安間の<span class='em'>好きなもの</span><br>まとめサイト</h1>
    <p class='lead'>気になっていることを、毎日自動で集めて並べるボードの入口です。見たいボードを選んでください。</p>
  </div>
</header>
<main>
  <div class='sec-head'><h2>ボード一覧</h2><span class='count' id='count'></span></div>
  <div class='boards' id='boards'></div>
</main>
<footer>新しいボードができたら、ここに追加されます。</footer>
<script>
// ボードを増やすときは、この配列に1件追加する
const BOARDS = [
  {
    title: 'ポケチャン上位構築ボード',
    tag: 'Pokémon Champions',
    desc: 'ランクマ最終上位と大会上位の構築を、シングルとダブルで並べて確認できます。',
    chips: ['シングル', 'ダブル', '毎週土曜1時に自動更新'],
    url: 'pokechamp/',
    icon: '<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' aria-hidden=\'true\'><circle cx=\'12\' cy=\'12\' r=\'9\'/><path d=\'M3 12h6M15 12h6\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>'
  },
  {
    title: 'グッズ情報まとめボード',
    tag: 'Pokémon · Marvel · HoYoverse',
    desc: 'ポケモン、マーベル、原神・ゼンレスゾーンゼロ・崩壊：スターレイルの公式グッズとコラボ商品を発売日順にまとめています。',
    chips: ['公式グッズ', 'コラボ', '毎週土曜4時に更新'],
    url: 'goods/',
    icon: '<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\' aria-hidden=\'true\'><path d=\'M5 8h14l-1 12H6z\'/><path d=\'M9 8V6a3 3 0 0 1 6 0v2\'/></svg>'
  },
  {
    title: 'AI情報ボード',
    tag: 'Claude · Generative AI',
    desc: 'Claude と Claude Code の使い方、Claude のアップデート・修正情報、ほかの生成AIの話題をまとめています。',
    chips: ['使い方', 'アップデート', 'ほかの生成AI', '毎朝6時に自動更新'],
    url: 'ai/',
    icon: '<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\' aria-hidden=\'true\'><path d=\'M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z\'/><path d=\'M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z\'/></svg>'
  }
];
const esc = s => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
document.getElementById('boards').innerHTML = BOARDS.map(b => `
  <a class='board' href='${esc(b.url)}'>
    <div class='top'><div class='mark'>${b.icon}</div><div><div class='tag'>${esc(b.tag)}</div><h3>${esc(b.title)}</h3></div></div>
    <p>${esc(b.desc)}</p>
    <div class='chips'>${b.chips.map(c => `<span class='chip'>${esc(c)}</span>`).join('')}</div>
    <span class='go'>ボードを開く<span class='arr' aria-hidden='true'>→</span></span>
  </a>`).join('') + `
  <div class='soon'><strong>次のボードを準備中</strong><span>新しいボードを作ったら、ここにボタンが増えます。</span></div>`;
document.getElementById('count').textContent = BOARDS.length + ' ボード';
</script>
</body>
</html>
